document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dy{margin:0;background:#141715;}\n    ::selection{background:#E8552A;color:#fff;}\n    @keyframes k-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}\n    a{color:#E8552A;text-decoration:none;}\n    a:hover{color:#FF6A3D;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#141715;color:#F2EFE9;font-family:'Archivo',sans-serif;padding:56px 64px 88px 64px;\">\n\n  <!-- HEADER -->\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid #3D423D;margin-bottom:40px;\">\n    <div style=\"display:flex;align-items:flex-start;gap:18px;\">\n      <span style=\"font-family:'Spectral',serif;font-size:48px;color:#E8552A;line-height:0.8;\">،<\u002Fspan>\n      <div>\n        <h1 style=\"font-family:'Spectral',serif;font-weight:500;font-size:48px;margin:0;letter-spacing:-0.01em;line-height:1.1;\">Kinaya OS<\u002Fh1>\n        <div style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;color:#A8A49B;margin-top:6px;\">Design language — planche de référence<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;color:#6E6B64;line-height:1.7;max-width:420px;\">\n      Système linéaire : les blocs existent par leur contour, jamais par un fond plein. Fond uniforme <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#A8A49B;\">#141715<\u002Fspan>. Vermillon = action + « aujourd'hui », jamais décoratif.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1. PALETTE -->\n  <div style=\"margin-bottom:20px;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">01<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Palette<\u002Fh2>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:24px;\">\n    <sc-for list=\"{{ paletteGroups }}\" as=\"grp\" hint-placeholder-count=\"4\">\n      <div style=\"border:1px solid #3D423D;border-radius:20px;padding:22px 24px;\">\n        <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:16px;\">{{ grp.label }}<\u002Fdiv>\n        <sc-for list=\"{{ grp.swatches }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid #2E312E;\">\n            <div style=\"width:34px;height:34px;border-radius:6px;flex-shrink:0;background:{{ s.hex }};border:1px solid {{ s.ring }};\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-size:13px;color:#F2EFE9;\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-size:11px;color:#6E6B64;font-family:ui-monospace,Menlo,monospace;\">{{ s.token }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#A8A49B;font-variant-numeric:tabular-nums;\">{{ s.hex }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- light mode strip -->\n  <div style=\"border:1px solid #3D423D;border-radius:20px;padding:22px 24px;margin-bottom:56px;\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:16px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;\">Mode clair « atelier » — secondaire<\u002Fdiv>\n      <div style=\"font-size:12px;color:#6E6B64;\">mêmes tokens, mêmes cadres au trait<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F2EFE9;border-radius:12px;padding:22px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;\">\n      <div style=\"border:1px solid #C4BEAC;border-radius:12px;padding:14px 18px;background:transparent;\">\n        <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#5A574F;margin-bottom:8px;\">CA du mois<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-size:32px;font-weight:500;color:#1A1D1A;letter-spacing:-0.01em;\">8,9M DA<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;\">\n        <button style=\"background:#D6491F;color:#FBFAF6;border:none;border-radius:999px;padding:10px 20px;font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;cursor:pointer;\">Action primaire<\u002Fbutton>\n        <button style=\"background:transparent;color:#1A1D1A;border:1px solid #C4BEAC;border-radius:999px;padding:10px 20px;font-family:'Archivo',sans-serif;font-weight:500;font-size:13px;cursor:pointer;\">Secondaire<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ lightSwatches }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"width:52px;height:34px;border-radius:6px;background:{{ s.hex }};border:1px solid #C4BEAC;\"><\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5A574F;margin-top:5px;\">{{ s.hex }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 2. TYPOGRAPHIE -->\n  <div style=\"margin-bottom:20px;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">02<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Typographie<\u002Fh2>\n    <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;color:#A8A49B;\">Spectral parle, Archivo compte<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:24px;\">\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:18px;\">Spectral — la voix<\u002Fdiv>\n      <sc-for list=\"{{ spectralScale }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid #2E312E;\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6E6B64;width:52px;flex-shrink:0;font-variant-numeric:tabular-nums;\">{{ t.size }}<\u002Fspan>\n          <span style=\"font-family:'Spectral',serif;font-size:{{ t.size }}px;font-weight:500;line-height:1.4;letter-spacing:-0.01em;color:#F2EFE9;\">{{ t.sample }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;color:#6E6B64;margin-top:14px;line-height:1.6;\">Titres de section, titres de fiche, montants héro, noms de projet, notes de concept. Interlignage 1.4–1.5, jamais serré.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:18px;\">Archivo — le fonctionnel<\u002Fdiv>\n      <sc-for list=\"{{ archivoScale }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid #2E312E;\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6E6B64;width:52px;flex-shrink:0;font-variant-numeric:tabular-nums;\">{{ t.size }}<\u002Fspan>\n          <span style=\"font-size:{{ t.size }}px;font-weight:500;line-height:1.35;color:#F2EFE9;\">{{ t.sample }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;color:#6E6B64;margin-top:14px;line-height:1.6;\">Données de tableau, labels, boutons, méta, dates, statuts. tabular-nums sur tout chiffre aligné.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- serif vs grotesque rule -->\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:56px;\">\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:6px;\">Un moment — montant héro<\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-size:48px;font-weight:500;letter-spacing:-0.01em;line-height:1.2;\">2 400 000 DA<\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-style:italic;font-size:15px;color:#A8A49B;margin-top:4px;\">Spectral — c'est une voix<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:14px;\">Une donnée — colonne de tableau<\u002Fdiv>\n      <sc-for list=\"{{ amountRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #2E312E;font-size:13px;\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">{{ r.code }}<\u002Fspan>\n          <span style=\"font-variant-numeric:tabular-nums;color:#A8A49B;\">{{ r.amount }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;color:#6E6B64;margin-top:12px;\">Archivo tabular-nums, aligné à droite.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 3. COMPOSANTS -->\n  <div style=\"margin-bottom:20px;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">03<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Composants<\u002Fh2>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px;\">\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:18px;\">Boutons — un seul primaire par écran<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;\">\n        <button style=\"background:#E8552A;color:#1A1300;border:none;border-radius:999px;padding:11px 22px;font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;cursor:pointer;\" style-hover=\"background:#FF6A3D;\">Primaire<\u002Fbutton>\n        <button style=\"background:transparent;color:#F2EFE9;border:1px solid #3D423D;border-radius:999px;padding:11px 22px;font-family:'Archivo',sans-serif;font-weight:500;font-size:13px;cursor:pointer;\" style-hover=\"border-color:#A8A49B;\">Secondaire<\u002Fbutton>\n        <button style=\"background:transparent;color:#A8A49B;border:none;border-radius:999px;padding:11px 16px;font-family:'Archivo',sans-serif;font-weight:500;font-size:13px;cursor:pointer;\" style-hover=\"color:#F2EFE9;\">Fantôme<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:12px;\">Champ — anneau vermillon au focus<\u002Fdiv>\n      <input placeholder=\"Nom du projet\" style=\"width:100%;box-sizing:border-box;background:transparent;border:1px solid #3D423D;border-radius:6px;padding:11px 14px;font-family:'Archivo',sans-serif;font-size:14px;color:#F2EFE9;outline:none;\" style-focus=\"border-color:#E8552A;box-shadow:0 0 0 3px rgba(232,85,42,0.18);\">\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:16px;\">Badges d'état — teintes sourdes<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;\">\n        <sc-for list=\"{{ statusBadges }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <span style=\"background:{{ b.bg }};color:{{ b.fg }};font-size:11px;padding:4px 12px;border-radius:999px;\">{{ b.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:16px;\">Badges de division — pleins (exception)<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n        <sc-for list=\"{{ divisionBadges }}\" as=\"d\" hint-placeholder-count=\"4\">\n          <span style=\"background:{{ d.hex }};color:#141715;font-size:11px;font-weight:600;padding:4px 14px;border-radius:999px;\">{{ d.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#6E6B64;margin-top:16px;line-height:1.6;\">Studio (S) net · Atelier (A) matière · Label (L) chaud · Généralités (G) sobre.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- table row anatomy -->\n  <div style=\"border:1px solid #3D423D;border-radius:20px;overflow:hidden;margin-bottom:56px;\">\n    <div style=\"padding:18px 24px;border-bottom:1px solid #3D423D;display:flex;align-items:baseline;gap:12px;\">\n      <span style=\"font-family:'Spectral',serif;font-size:20px;\">Ligne de tableau<\u002Fspan>\n      <span style=\"font-size:12px;color:#6E6B64;\">hairlines horizontales seules · aucune grille verticale · lignes ~40px<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:2.2fr 1fr 0.8fr 1fr 1fr;padding:10px 24px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;border-bottom:1px solid #2E312E;\">\n      <div>Projet<\u002Fdiv><div>Code<\u002Fdiv><div>Division<\u002Fdiv><div>Statut<\u002Fdiv><div style=\"text-align:right;\">Montant<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ tableRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n      <div style=\"display:grid;grid-template-columns:2.2fr 1fr 0.8fr 1fr 1fr;padding:11px 24px;align-items:center;border-bottom:1px solid #2E312E;font-size:13px;\" style-hover=\"background:#1C1F1D;\">\n        <div style=\"font-family:'Spectral',serif;font-size:16px;\">{{ r.name }}<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">{{ r.code }}<\u002Fdiv>\n        <div><span style=\"background:{{ r.divHex }};color:#141715;font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;\">{{ r.division }}<\u002Fspan><\u002Fdiv>\n        <div><span style=\"background:{{ r.statusBg }};color:{{ r.statusFg }};font-size:11px;padding:3px 11px;border-radius:999px;\">{{ r.status }}<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align:right;font-variant-numeric:tabular-nums;color:#A8A49B;\">{{ r.amount }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- 4. SIGNATURE -->\n  <div style=\"margin-bottom:20px;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">04<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Signature<\u002Fh2>\n    <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;color:#A8A49B;\">phénakistiscope — seule audace du système<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px;\">\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px;\">\n      <div style=\"position:relative;width:104px;height:104px;\">\n        <div style=\"{{ loaderStyle }}\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:11px;border-radius:999px;background:#141715;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"font-size:13px;color:#F2EFE9;\">Chargement<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6B64;margin-top:3px;\">rotation continue, 1.6s linéaire<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px;\">\n      <div style=\"position:relative;width:104px;height:104px;\">\n        <div style=\"{{ gaugeStyle }}\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:11px;border-radius:999px;background:#141715;display:flex;align-items:center;justify-content:center;\">\n          <span style=\"font-family:'Spectral',serif;font-size:24px;font-weight:500;\">72%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"font-size:13px;color:#F2EFE9;\">Jauge de progression projet<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6B64;margin-top:3px;\">teinte de statut, arc partiel<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:18px;\">\n      <div style=\"position:relative;width:104px;height:104px;\">\n        <div style=\"{{ loadStyle }}\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:11px;border-radius:999px;background:#141715;display:flex;align-items:center;justify-content:center;flex-direction:column;\">\n          <span style=\"font-family:'Spectral',serif;font-size:24px;font-weight:500;\">68%<\u002Fspan>\n          <span style=\"font-size:9px;color:#6E6B64;text-transform:uppercase;letter-spacing:0.05em;\">charge<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"font-size:13px;color:#F2EFE9;\">Jauge de charge studio<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6B64;margin-top:3px;\">vermillon — accent héro du dashboard<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #4A3A2E;border-radius:20px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;\">\n      <div style=\"font-family:'Spectral',serif;font-size:64px;color:#E8552A;line-height:0.7;\">،<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;margin-bottom:8px;\">Virgule arabe<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6B64;line-height:1.6;\">Ancre de marque — seule en tête du menu latéral, puce des listes d'idées, séparateur. Pas de wordmark, pas de logotype.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 5. BOUTONS & CONTRÔLES -->\n  <div style=\"margin:56px 0 20px 0;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">05<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Boutons &amp; contrôles<\u002Fh2>\n    <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;color:#A8A49B;\">un seul plein par écran<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px;\">\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:18px;\">Tailles — sm / md / lg<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px;\">\n        <button style=\"background:#E8552A;color:#1A1300;border:none;border-radius:999px;padding:7px 16px;font-family:'Archivo',sans-serif;font-weight:600;font-size:12px;cursor:pointer;\" style-hover=\"background:#FF6A3D;\">Petit<\u002Fbutton>\n        <button style=\"background:#E8552A;color:#1A1300;border:none;border-radius:999px;padding:11px 22px;font-family:'Archivo',sans-serif;font-weight:600;font-size:13px;cursor:pointer;\" style-hover=\"background:#FF6A3D;\">Moyen<\u002Fbutton>\n        <button style=\"background:#E8552A;color:#1A1300;border:none;border-radius:999px;padding:15px 30px;font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;cursor:pointer;\" style-hover=\"background:#FF6A3D;\">Grand<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:14px;\">Icône + libellé · icône seule · désactivé<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;\">\n        <button style=\"background:transparent;color:#F2EFE9;border:1px solid #3D423D;border-radius:999px;padding:10px 20px;font-family:'Archivo',sans-serif;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;\" style-hover=\"border-color:#A8A49B;\"><span style=\"color:#E8552A;\">◐<\u002Fspan>Exporter<\u002Fbutton>\n        <button style=\"background:transparent;color:#A8A49B;border:1px solid #3D423D;border-radius:999px;width:38px;height:38px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;\" style-hover=\"border-color:#A8A49B;color:#F2EFE9;\">◇<\u002Fbutton>\n        <button style=\"background:transparent;color:#3D423D;border:1px solid #2E312E;border-radius:999px;padding:10px 20px;font-family:'Archivo',sans-serif;font-weight:500;font-size:13px;cursor:not-allowed;\">Indisponible<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:16px;\">Segmented control<\u002Fdiv>\n      <div style=\"display:inline-flex;border:1px solid #3D423D;border-radius:999px;padding:3px;margin-bottom:22px;\">\n        <sc-for list=\"{{ segments }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button style=\"background:{{ s.bg }};color:{{ s.fg }};border:none;border-radius:999px;padding:7px 18px;font-family:'Archivo',sans-serif;font-weight:500;font-size:12px;cursor:pointer;\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:14px;\">Filtres · destructif · lien<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;\">\n        <sc-for list=\"{{ filterChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <button style=\"background:transparent;color:{{ c.fg }};border:1px solid {{ c.border }};border-radius:999px;padding:6px 14px;font-family:'Archivo',sans-serif;font-size:12px;cursor:pointer;\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <button style=\"background:transparent;color:#B4472E;border:1px solid rgba(180,71,46,0.45);border-radius:999px;padding:6px 14px;font-family:'Archivo',sans-serif;font-size:12px;cursor:pointer;\" style-hover=\"background:rgba(180,71,46,0.12);\">Supprimer<\u002Fbutton>\n        <button style=\"background:transparent;color:#E8552A;border:none;padding:6px 2px;font-family:'Archivo',sans-serif;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(232,85,42,0.4);\">Tout voir<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 6. VISUALISATION DE DONNÉES -->\n  <div style=\"margin:56px 0 20px 0;display:flex;align-items:baseline;gap:14px;\">\n    <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6E6B64;\">06<\u002Fspan>\n    <h2 style=\"font-family:'Spectral',serif;font-weight:500;font-size:32px;margin:0;letter-spacing:-0.01em;\">Visualisation de données<\u002Fh2>\n    <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:18px;color:#A8A49B;\">axes au trait, séries en teintes de division<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px;\">\n\n    <!-- bar chart -->\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:4px;\">CA par mois<\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-size:24px;font-weight:500;margin-bottom:20px;\">8,9M DA<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:1px solid #3D423D;padding-bottom:0;\">\n        <sc-for list=\"{{ barSeries }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;\">\n            <div style=\"width:100%;height:{{ b.pct }}%;background:{{ b.fill }};border:1px solid {{ b.stroke }};border-radius:6px 6px 0 0;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:8px;\">\n        <sc-for list=\"{{ barSeries }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;text-align:center;font-size:11px;color:#6E6B64;\">{{ b.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- sparkline / area -->\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:4px;\">Taux de conversion<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:20px;\">\n        <div style=\"font-family:'Spectral',serif;font-size:24px;font-weight:500;\">38%<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6B8F5E;font-variant-numeric:tabular-nums;\">+4 pts<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 260 110\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:130px;display:block;\">\n        <line x1=\"0\" y1=\"36\" x2=\"260\" y2=\"36\" stroke=\"#2E312E\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"0\" y1=\"72\" x2=\"260\" y2=\"72\" stroke=\"#2E312E\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"0\" y1=\"108\" x2=\"260\" y2=\"108\" stroke=\"#3D423D\" stroke-width=\"1\"><\u002Fline>\n        <polyline points=\"{{ sparkArea }}\" fill=\"rgba(92,122,138,0.18)\" stroke=\"none\"><\u002Fpolyline>\n        <polyline points=\"{{ sparkLine }}\" fill=\"none\" stroke=\"#5C7A8A\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n        <circle cx=\"{{ sparkLastX }}\" cy=\"{{ sparkLastY }}\" r=\"3.5\" fill=\"#E8552A\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:#6E6B64;\">\n        <span>S23<\u002Fspan><span>S30<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- donut by division -->\n    <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:18px;\">Répartition par division<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;\">\n        <div style=\"position:relative;width:112px;height:112px;flex-shrink:0;\">\n          <div style=\"{{ donutStyle }}\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:17px;border-radius:999px;background:#141715;border:1px solid #2E312E;display:flex;align-items:center;justify-content:center;flex-direction:column;\">\n            <span style=\"font-family:'Spectral',serif;font-size:18px;font-weight:500;\">14<\u002Fspan>\n            <span style=\"font-size:9px;color:#6E6B64;text-transform:uppercase;letter-spacing:0.05em;\">projets<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:130px;\">\n          <sc-for list lor:#A8A49B;margin-bottom:10px;\">Stat<\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-size:32px;font-weight:500;letter-spacing:-0.01em;\">2,1M DA<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-top:8px;\">\n        <span style=\"font-size:12px;color:#C9922E;\">3 échéances<\u002Fspan>\n        <span style=\"width:1px;height:11px;background:#2E312E;\"><\u002Fspan>\n        <span style=\"font-size:12px;color:#6E6B64;\">cette semaine<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- project card -->\n    <div style=\"border:1px solid #3D423D;border-radius:12px;padding:20px 22px;\" style-hover=\"border-color:#A8A49B;\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n        <span style=\"background:#5C7A8A;color:#141715;font-size:11px;font-weight:600;padding:3px 11px;border-radius:999px;\">S<\u002Fspan>\n        <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6E6B64;\">KIN-26-S-014<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-size:20px;font-weight:500;margin-bottom:4px;\">Sloughi Nocturne<\u002Fdiv>\n      <div style=\"font-size:12px;color:#6E6B64;margin-bottom:16px;\">Production · livraison 12 sept.<\u002Fdiv>\n      <div style=\"height:5px;border-radius:999px;background:#2E312E;overflow:hidden;margin-bottom:8px;\">\n        <div style=\"height:100%;width:62%;background:rgba(232,85,42,0.6);border-radius:999px;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#6E6B64;font-variant-numeric:tabular-nums;\">\n        <span>62%<\u002Fspan><span>2 400 000 DA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- dense list card -->\n    <div style=\"border:1px solid #3D423D;border-radius:12px;padding:20px 22px;\">\n      <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:12px;\">Liste dense<\u002Fdiv>\n      <sc-for list=\"{{ denseList }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #2E312E;font-size:13px;\">\n          <span style=\"color:#F2EFE9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ d.label }}<\u002Fspan>\n          <span style=\"color:{{ d.color }};font-variant-numeric:tabular-nums;flex-shrink:0;\">{{ d.value }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- radial card -->\n    <div style=\"border:1px solid #3D423D;border-radius:12px;padding:20px 22px;display:flex;align-items:center;gap:18px;\">\n      <div style=\"position:relative;width:76px;height:76px;flex-shrink:0;\">\n        <div style=\"{{ cardRadialStyle }}\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:9px;border-radius:999px;background:#141715;display:flex;align-items:center;justify-content:center;\">\n          <span style=\"font-family:'Spectral',serif;font-size:18px;font-weight:500;\">68%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:6px;\">Charge studio<\u002Fdiv>\n        <div style=\"font-size:12px;color:#6E6B64;line-height:1.6;\">Marge disponible avant vendredi.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- person card -->\n    <div style=\"border:1px solid #3D423D;border-radius:12px;padding:20px 22px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px;\">\n        <div style=\"width:38px;height:38px;border-radius:999px;border:1px solid #3D423D;display:flex;align-items:center;justify-content:center;font-size:13px;color:#A8A49B;\">YB<\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Spectral',serif;font-size:17px;\">Yasmine Belkacem<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6E6B64;\">Direction de production<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n        <span style=\"background:rgba(168,164,155,0.12);color:#A8A49B;font-size:11px;padding:3px 11px;border-radius:999px;\">4 projets<\u002Fspan>\n        <span style=\"background:rgba(201,146,46,0.16);color:#C9922E;font-size:11px;padding:3px 11px;border-radius:999px;\">1 échéance<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- concept note card (warm, creative) -->\n    <div style=\"border:1px solid #4A3A2E;border-radius:12px;padding:20px 22px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px;\">\n        <span style=\"font-family:'Spectral',serif;font-size:18px;color:#E8552A;\">،<\u002Fspan>\n        <span style=\"font-family:'Spectral',serif;font-style:italic;font-size:17px;\">Note de concept<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'Spectral',serif;font-size:15px;line-height:1.5;color:#F2EFE9;\">Garder le grain de l'EP Nassim Kesri — pas de néon, la nuit doit rester chaude.<\u002Fdiv>\n      <div style=\"font-size:11px;color:#6E6B64;margin-top:14px;\">Label · 24 juil.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- rules footer -->\n  <div style=\"border:1px solid #3D423D;border-radius:20px;padding:24px 26px;\">\n    <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#A8A49B;margin-bottom:16px;\">Règles transverses<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;\">\n      <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:10px;\">\n          <span style=\"font-family:'Spectral',serif;color:#E8552A;font-size:16px;line-height:1.3;\">،<\u002Fspan>\n          <div>\n            <div style=\"font-size:13px;color:#F2EFE9;margin-bottom:4px;\">{{ r.title }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#6E6B64;line-height:1.6;\">{{ r.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- geometry / grid -->\n  <div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid #2E312E;font-size:12px;color:#6E6B64;\">\n    <span>Radius 6 / 12 / 20 · pill 999<\u002Fspan>\n    <span>Grille 4px<\u002Fspan>\n    <span>Échelle 48/32/24/18/15/13/11 · corps 15 · données 13<\u002Fspan>\n    <span style=\"font-family:ui-monospace,Menlo,monospace;\">KIN-26-S-014<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const ring = '#3D423D';\n    const paletteGroups = [\n      {label:'Fonds', swatches:[\n        {name:'Base', token:'--bg-base', hex:'#141715', ring},\n        {name:'Surface', token:'--bg-surface', hex:'#1C1F1D', ring},\n        {name:'Élevé', token:'--bg-elevated', hex:'#252825', ring},\n        {name:'Puits', token:'--bg-sunken', hex:'#0F110F', ring}\n      ]},\n      {label:'Texte', swatches:[\n        {name:'Ivoire', token:'--fg-primary', hex:'#F2EFE9', ring},\n        {name:'Secondaire', token:'--fg-secondary', hex:'#A8A49B', ring},\n        {name:'Atténué', token:'--fg-muted', hex:'#6E6B64', ring},\n        {name:'Hairline', token:'--border', hex:'#2E312E', ring}\n      ]},\n      {label:'Accent + états', swatches:[\n        {name:'Vermillon', token:'--accent', hex:'#E8552A', ring:'transparent'},\n        {name:'Vermillon hover', token:'--accent-hover', hex:'#FF6A3D', ring:'transparent'},\n        {name:'Payé — sauge', token:'--state-paid', hex:'#6B8F5E', ring:'transparent'},\n        {name:'Échéance — ambre', token:'--state-due', hex:'#C9922E', ring:'transparent'},\n        {name:'Retard — brique', token:'--state-late', hex:'#B4472E', ring:'transparent'}\n      ]},\n      {label:'Divisions — teintes sourdes', swatches:[\n        {name:'Studio (S)', token:'--div-studio', hex:'#5C7A8A', ring:'transparent'},\n        {name:'Atelier (A)', token:'--div-atelier', hex:'#8A8455', ring:'transparent'},\n        {name:'Label (L)', token:'--div-label', hex:'#8A5C74', ring:'transparent'},\n        {name:'Généralités (G)', token:'--div-general', hex:'#5F7A66', ring:'transparent'}\n      ]}\n    ];\n\n    const lightSwatches = [\n      {hex:'#F2EFE9'}, {hex:'#FBFAF6'}, {hex:'#1A1D1A'}, {hex:'#D6491F'}\n    ];\n\n    const spectralScale = [\n      {size:48, sample:'8,9M DA'},\n      {size:32, sample:'Tableau de bord'},\n      {size:24, sample:'Sloughi Nocturne'},\n      {size:18, sample:'Semaine 30 — capacité'},\n      {size:15, sample:'Revoir l\\'ouverture du court'}\n    ];\n    const archivoScale = [\n      {size:18, sample:'Pipeline commercial'},\n      {size:15, sample:'Corps fonctionnel, 15px'},\n      {size:13, sample:'2 400 000 DA · 26 juil. 2026'},\n      {size:11, sample:'DIVISION · STATUT · MONTANT'}\n    ];\n\n    const amountRows = [\n      {code:'KIN-26-S-014', amount:'2 400 000 DA'},\n      {code:'KIN-26-A-008', amount:'980 000 DA'},\n      {code:'KIN-26-L-002', amount:'1 150 000 DA'}\n    ];\n\n    const statusBadges = [\n      {label:'Payé', bg:'rgba(107,143,94,0.16)', fg:'#6B8F5E'},\n      {label:'Échéance', bg:'rgba(201,146,46,0.16)', fg:'#C9922E'},\n      {label:'Retard', bg:'rgba(180,71,46,0.16)', fg:'#B4472E'},\n      {label:'En cours', bg:'rgba(168,164,155,0.12)', fg:'#A8A49B'}\n    ];\n    const divisionBadges = [\n      {label:'S', hex:'#5C7A8A'}, {label:'A', hex:'#8A8455'},\n      {label:'L', hex:'#8A5C74'}, {label:'G', hex:'#5F7A66'}\n    ];\n\n    const tableRows = [\n      {name:'Sloughi Nocturne', code:'KIN-26-S-014', division:'S', divHex:'#5C7A8A', status:'En cours', statusBg:'rgba(168,164,155,0.12)', statusFg:'#A8A49B', amount:'2 400 000 DA'},\n      {name:'Campagne Djezzy Ramadan', code:'KIN-26-G-021', division:'G', divHex:'#5F7A66', status:'Payé', statusBg:'rgba(107,143,94,0.16)', statusFg:'#6B8F5E', amount:'3 600 000 DA'},\n      {name:'Court-métrage Bab El Oued', code:'KIN-26-S-019', division:'S', divHex:'#5C7A8A', status:'Retard', statusBg:'rgba(180,71,46,0.16)', statusFg:'#B4472E', amount:'1 800 000 DA'}\n    ];\n\n    const spokes = 'repeating-conic-gradient(from 0deg, #3D423D 0deg 4deg, transparent 4deg 18deg)';\n    const disc = (color, pct, spin) =>\n      `position:absolute;inset:0;border-radius:999px;` +\n      `background:conic-gradient(${color} 0deg ${pct*3.6}deg, transparent ${pct*3.6}deg 360deg), ${spokes}, #252825;` +\n      (spin ? 'animation:k-spin 1.6s linear infinite;' : '');\n\n    const rules = [\n      {title:'Cadres fermés, jamais de fond plein', body:'Chaque bloc se définit par un filet continu sur ses quatre côtés. Le fond reste --bg-base à l\\'intérieur comme à l\\'extérieur.'},\n      {title:'Vermillon strictement réservé', body:'Action primaire, état actif, marqueur « aujourd\\'hui ». Jamais décoratif, jamais un remplissage de barre générique.'},\n      {title:'Le contraste serif/grotesque EST la hiérarchie', body:'Spectral = contenu. Archivo = mécanique. Plus une surface est fonctionnelle, plus Archivo domine.'},\n      {title:'Une seule audace', body:'Le motif radial. Tout le reste discipliné, aéré, au trait. Trois exceptions pleines : bouton primaire, radial, badges de division.'}\n    ];\n\n    const DIV = {S:'#5C7A8A', A:'#8A8455', L:'#8A5C74', G:'#5F7A66'};\n\n    const segments = ['Semaine','Mois','Trimestre'].map((label,i) => ({\n      label,\n      bg: i === 1 ? 'rgba(232,85,42,0.14)' : 'transparent',\n      fg: i === 1 ? '#F2EFE9' : '#A8A49B'\n    }));\n\n    const filterChips = [\n      {label:'Toutes divisions', fg:'#F2EFE9', border:'#A8A49B'},\n      {label:'Studio', fg:'#A8A49B', border:'#3D423D'},\n      {label:'Label', fg:'#A8A49B', border:'#3D423D'}\n    ];\n\n    const barVals = [48, 62, 55, 78, 41, 88, 70];\n    const barSeries = barVals.map((v,i) => ({\n      pct: v, label: ['Jan','Fév','Mar','Avr','Mai','Juin','Juil'][i],\n      fill: i === 6 ? 'rgba(232,85,42,0.18)' : 'rgba(92,122,138,0.20)',\n      stroke: i === 6 ? '#E8552A' : '#5C7A8A'\n    }));\n\n    const spark = [22, 30, 26, 41, 38, 52, 47, 63, 58, 74];\n    const sx = i => (i/(spark.length-1)*260).toFixed(1);\n    const sy = v => (108 - v/80*100).toFixed(1);\n    const sparkLine = spark.map((v,i) => `${sx(i)},${sy(v)}`).join(' ');\n    const sparkArea = `0,108 ${sparkLine} 260,108`;\n\n    const donutParts = [\n      {label:'Studio', value:6, hex:DIV.S},\n      {label:'Atelier', value:4, hex:DIV.A},\n      {label:'Label', value:2, hex:DIV.L},\n      {label:'Généralités', value:2, hex:DIV.G}\n    ];\n    const donutTotal = donutParts.reduce((a,p) => a+p.value, 0);\n    let acc = 0;\n    const donutStops = donutParts.map(p => {\n      const from = acc/donutTotal*360, to = (acc+p.value)/donutTotal*360;\n      acc += p.value;\n      return `${p.hex} ${from.toFixed(1)}deg ${to.toFixed(1)}deg`;\n    }).join(', ');\n    const donutStyle = `position:absolute;inset:0;border-radius:999px;background:conic-gradient(${donutStops});`;\n    const donutLegend = donutParts;\n\n    const stacked = [\n      {pct:38, hex:DIV.S}, {pct:27, hex:DIV.A}, {pct:20, hex:DIV.L}, {pct:15, hex:DIV.G}\n    ];\n    const funnel = [\n      {label:'Prospection', amount:'12,4M DA', pct:100, hex:'rgba(168,164,155,0.35)'},\n      {label:'Devis envoyé', amount:'7,8M DA', pct:63, hex:DIV.S},\n      {label:'Négociation', amount:'4,6M DA', pct:37, hex:'#C9922E'},\n      {label:'Signé', amount:'2,9M DA', pct:23, hex:'#6B8F5E'}\n    ];\n\n    const heatSteps = ['rgba(92,122,138,0.10)','rgba(92,122,138,0.24)','rgba(92,122,138,0.42)','rgba(92,122,138,0.62)','rgba(232,85,42,0.55)'];\n    const heatSeed = [0,1,2,1,3,2,0,1,2,3,2,1,0,2, 1,2,3,4,3,1,0,2,3,3,2,4,1,0, 2,3,1,2,4,3,1,1,2,3,4,2,1,0];\n    const heatmap = heatSeed.map(n => ({bg: heatStep
